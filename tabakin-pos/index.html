<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <link rel="apple-touch-icon" href="icon.png?v=2">
  <link rel="icon" type="image/png" href="icon.png?v=2">
  <meta name="theme-color" content="#050605">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Табакин POS">
  <title>Учет продаж и склада</title>
  <style>
    :root {
      --bg: #050605;
      --card-bg: linear-gradient(160deg, rgba(46, 49, 47, 0.55) 0%, rgba(22, 24, 23, 0.55) 100%);
      --card-solid: #161817;
      --card-sub: rgba(255, 255, 255, 0.04);
      --accent-green: #3ee06e;
      --accent-green-soft: #9cf5b4;
      --accent-blue: #3d9bff;
      --accent-blue-soft: #8ec5ff;
      --accent-red: #ff5a52;
      --accent-orange: #ffa524;
      --accent-orange-soft: #ffcf87;
      --glow: 0 0 18px rgba(62, 224, 110, 0.45);
      --glow-strong: 0 0 28px rgba(62, 224, 110, 0.55), 0 0 4px rgba(62, 224, 110, 0.8);
      --text: #f2f5f3;
      --text-sec: #8a938d;
      --border: rgba(255, 255, 255, 0.07);
      --border-glass: rgba(156, 245, 180, 0.14);
      --highlight: inset 0 1px 0 rgba(255, 255, 255, 0.07);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
    html { background: var(--bg); }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      background:
        radial-gradient(ellipse 80% 45% at 50% -5%, rgba(62, 224, 110, 0.13), transparent 70%),
        radial-gradient(ellipse 60% 40% at 0% 45%, rgba(255, 165, 36, 0.06), transparent 70%),
        radial-gradient(ellipse 60% 40% at 100% 70%, rgba(61, 155, 255, 0.07), transparent 70%),
        var(--bg);
      background-attachment: fixed;
      color: var(--text);
      min-height: 100vh;
      padding: env(safe-area-inset-top, 20px) 16px env(safe-area-inset-bottom, 30px);
      max-width: 500px;
      margin: 0 auto;
    }

    header { display: flex; justify-content: space-between; align-items: center; margin: 15px 0 22px; gap: 12px; }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
    h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }
    #key-label { font-size: 12px; color: var(--text-sec); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .glass, .stat-card, .tabs, .product-card, .history-item {
      background: var(--card-bg);
      border: 1px solid var(--border);
      box-shadow: var(--highlight), 0 10px 30px rgba(0, 0, 0, 0.45);
      -webkit-backdrop-filter: blur(18px);
      backdrop-filter: blur(18px);
    }

    .dashboard { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
    .stat-card { border-radius: 20px; padding: 16px; position: relative; overflow: hidden; }
    .stat-card.full {
      grid-column: span 2;
      padding: 20px 18px;
      background: linear-gradient(150deg, rgba(62, 224, 110, 0.14) 0%, rgba(30, 33, 31, 0.6) 55%, rgba(18, 20, 19, 0.6) 100%);
      border-color: rgba(62, 224, 110, 0.3);
      box-shadow: var(--highlight), 0 0 40px rgba(62, 224, 110, 0.1), 0 10px 30px rgba(0, 0, 0, 0.45);
    }
    .stat-card.full::after {
      content: ""; position: absolute; top: 0; right: 28px; width: 34px; height: 100%;
      background: linear-gradient(180deg, rgba(62, 224, 110, 0.35), rgba(62, 224, 110, 0.04));
      border-radius: 0 0 8px 8px; filter: blur(0.5px); opacity: 0.55;
      box-shadow: 0 0 24px rgba(62, 224, 110, 0.35);
    }
    .stat-title { font-size: 12px; color: var(--text-sec); font-weight: 600; margin-bottom: 6px; letter-spacing: 0.3px; position: relative; z-index: 1; }
    .stat-val { font-size: 24px; font-weight: 800; letter-spacing: -0.5px; position: relative; z-index: 1; }
    .stat-card.full .stat-val { font-size: 32px; }
    .stat-val.green { color: var(--accent-green); text-shadow: var(--glow); }
    .stat-card.orange { background: linear-gradient(150deg, rgba(255, 165, 36, 0.11) 0%, rgba(26, 28, 27, 0.6) 60%); border-color: rgba(255, 165, 36, 0.22); }
    .stat-card.blue { background: linear-gradient(150deg, rgba(61, 155, 255, 0.12) 0%, rgba(26, 28, 27, 0.6) 60%); border-color: rgba(61, 155, 255, 0.24); }
    .stat-val.blue { color: var(--accent-blue); text-shadow: 0 0 16px rgba(61, 155, 255, 0.4); }
    .stat-val.orange { color: var(--accent-orange); text-shadow: 0 0 16px rgba(255, 165, 36, 0.38); }

    .tabs { display: flex; border-radius: 16px; padding: 4px; margin-bottom: 20px; }
    .tab-btn { flex: 1; border: 1px solid transparent; background: transparent; color: var(--text-sec); padding: 10px; font-size: 14px; font-weight: 600; border-radius: 12px; cursor: pointer; transition: 0.2s; }
    .tab-btn.active {
      background: rgba(62, 224, 110, 0.12);
      border-color: rgba(62, 224, 110, 0.35);
      color: var(--accent-green);
      box-shadow: 0 0 14px rgba(62, 224, 110, 0.18), inset 0 1px 0 rgba(255, 255, 255, 0.06);
    }

    .product-list { display: flex; flex-direction: column; gap: 14px; }
    .product-card { border-radius: 22px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
    .card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    .prod-name { font-size: 18px; font-weight: 700; }
    .badge { font-size: 12px; padding: 4px 10px; border-radius: 20px; font-weight: 700; white-space: nowrap; }
    .badge.in-stock { background: rgba(62, 224, 110, 0.12); color: var(--accent-green); border: 1px solid rgba(62, 224, 110, 0.35); box-shadow: 0 0 10px rgba(62, 224, 110, 0.2); }
    .badge.out { background: rgba(255, 90, 82, 0.12); color: var(--accent-red); border: 1px solid rgba(255, 90, 82, 0.3); }

    .note-tag { display: inline-block; font-size: 13px; color: var(--accent-orange-soft); background: rgba(255, 165, 36, 0.08); padding: 6px 10px; border-radius: 10px; border: 1px solid rgba(255, 165, 36, 0.22); }

    .fin-row { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-sec); background: var(--card-sub); border: 1px solid var(--border); padding: 10px 14px; border-radius: 14px; }
    .fin-item b { color: var(--text); display: block; font-size: 15px; margin-top: 2px; }

    .actions-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 4px; }
    .btn { border: none; border-radius: 14px; padding: 14px; font-size: 14px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.15s; }
    .btn:active { transform: scale(0.98); opacity: 0.85; }
    .btn:disabled { box-shadow: none; color: var(--text-sec); cursor: default; }
    .btn-sell {
      background: linear-gradient(180deg, #5cf088 0%, #2fc95c 100%);
      color: #031207;
      box-shadow: var(--glow), inset 0 1px 0 rgba(255, 255, 255, 0.35);
    }
    .btn-discount { background: rgba(255, 165, 36, 0.1); color: var(--accent-orange); border: 1px solid rgba(255, 165, 36, 0.35); box-shadow: 0 0 14px rgba(255, 165, 36, 0.12); }
    .btn-add {
      background: linear-gradient(180deg, #5eb0ff 0%, #2a83f0 100%);
      color: #fff; width: 100%; margin-top: 10px;
      box-shadow: 0 0 18px rgba(61, 155, 255, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.3);
    }
    .btn-outline { background: rgba(255, 255, 255, 0.03); border: 1px solid var(--border); color: var(--text-sec); font-size: 13px; padding: 8px 12px; border-radius: 10px; cursor: pointer; transition: 0.15s; }
    .btn-outline:active { transform: scale(0.98); }
    header .btn-outline { color: var(--accent-blue-soft); border-color: rgba(61, 155, 255, 0.4); background: rgba(61, 155, 255, 0.1); padding: 10px 14px; font-weight: 600; box-shadow: 0 0 14px rgba(61, 155, 255, 0.18); }

    h2, h3 { letter-spacing: -0.3px; }

    .form-group { margin-bottom: 12px; }
    label { font-size: 13px; color: var(--text-sec); display: block; margin-bottom: 6px; }
    input { width: 100%; background: rgba(0, 0, 0, 0.35); border: 1px solid var(--border); color: var(--text); padding: 14px; border-radius: 14px; font-size: 16px; outline: none; transition: 0.2s; }
    input::placeholder { color: #4d544f; }
    input:focus { border-color: rgba(61, 155, 255, 0.6); box-shadow: 0 0 0 3px rgba(61, 155, 255, 0.14), 0 0 16px rgba(61, 155, 255, 0.16); }

    .history-item { border-radius: 16px; padding: 14px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    .btn-del-hist { background: rgba(255, 90, 82, 0.1); color: var(--accent-red); border: 1px solid rgba(255, 90, 82, 0.25); width: 32px; height: 32px; border-radius: 10px; font-weight: bold; cursor: pointer; margin-left: 12px; }

    #modal-add { -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
    #modal-add .product-card { background: linear-gradient(160deg, rgba(40, 43, 41, 0.92) 0%, rgba(18, 20, 19, 0.95) 100%); border-color: var(--border-glass); box-shadow: var(--highlight), 0 0 40px rgba(61, 155, 255, 0.12), 0 20px 50px rgba(0, 0, 0, 0.6); }

    .toast {
      position: fixed; bottom: calc(env(safe-area-inset-bottom, 20px) + 20px); left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(20, 24, 21, 0.9); color: var(--accent-green);
      border: 1px solid rgba(62, 224, 110, 0.4);
      box-shadow: 0 0 24px rgba(62, 224, 110, 0.3);
      -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
      padding: 12px 24px; border-radius: 30px; font-weight: 600; font-size: 14px;
      transition: 0.3s; opacity: 0; z-index: 100; white-space: nowrap;
    }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

    /* Скрытый переключатель для haptic-отклика на iOS (не display:none — Safari тогда может не вибрировать) */
    .haptic-switch { position: fixed; left: -9999px; top: 0; width: 1px; height: 1px; opacity: 0; pointer-events: none; overflow: hidden; }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div style="min-width: 0;">
        <h1>Табакин POS</h1>
        <div id="key-label"></div>
      </div>
    </div>
    <button class="btn-outline" onclick="openAddModal()">+ Добавить</button>
  </header>

  <!-- ДАШБОРД -->
  <div class="dashboard">
    <div class="stat-card full">
      <div class="stat-title">ЧИСТАЯ ПРИБЫЛЬ</div>
      <div class="stat-val green" id="stat-total-profit">0 ₽</div>
    </div>
    <div class="stat-card orange">
      <div class="stat-title">В товаре на складе</div>
      <div class="stat-val orange" id="stat-stock-cost">0 ₽</div>
    </div>
    <div class="stat-card blue">
      <div class="stat-title">Общая выручка</div>
      <div class="stat-val blue" id="stat-revenue">0 ₽</div>
    </div>
  </div>

  <!-- ТАБЫ -->
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('stock')">📦 В наличии</button>
    <button class="tab-btn" onclick="switchTab('history')">📊 История</button>
    <button class="tab-btn" onclick="switchTab('settings')">⚙️ Опции</button>
  </div>

  <!-- ВКЛАДКА 1: СКЛАД -->
  <div id="tab-stock">
    <div class="product-list" id="products-container"></div>
  </div>

  <!-- ВКЛАДКА 2: ИСТОРИЯ -->
  <div id="tab-history" style="display: none;">
    <div id="history-container"></div>
  </div>

  <!-- ВКЛАДКА 3: НАСТРОЙКИ -->
  <div id="tab-settings" style="display: none;">
    <div class="product-card">
      <h3 style="margin-bottom: 10px;">🏷 Настройка быстрой скидки</h3>
      <div class="form-group">
        <label>Размер скидки для кнопки (в рублях)</label>
        <input type="number" id="setting-discount" placeholder="100">
      </div>
      <button class="btn btn-add" onclick="saveSettings()">Сохранить скидку</button>
    </div>

    <div class="product-card" style="margin-top: 14px;">
      <h3 style="margin-bottom: 6px;">🔑 Доступ и Синхронизация</h3>
      <p style="font-size: 13px; color: var(--text-sec); margin-bottom: 12px;">Чтобы войти с ПК, открой эту же ссылку с твоим keyword на компьютере.</p>
      <button class="btn-outline" style="width: 100%;" onclick="copyLink()">📋 Скопировать ссылку для ПК</button>
      <button class="btn-outline" style="width: 100%; margin-top: 8px; color: var(--accent-red);" onclick="changeKeyword()">Сменить Keyword</button>
    </div>
  </div>

  <!-- МОДАЛКА: ДОБАВИТЬ ТОВАР -->
  <div id="modal-add" style="display:none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 50; padding: 20px; justify-content: center; align-items: flex-end;">
    <div class="product-card" style="width: 100%; border-radius: 24px; max-height: 90vh; overflow-y: auto;">
      <h2 style="font-size: 20px; margin-bottom: 12px;">Новая позиция</h2>
      <div class="form-group">
        <label>Название товара</label>
        <input type="text" id="new-name" placeholder="Напр. PLONQ 1500">
      </div>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
        <div class="form-group">
          <label>Закуп (₽/шт)</label>
          <input type="number" id="new-buy" placeholder="940">
        </div>
        <div class="form-group">
          <label>Продажа (₽/шт)</label>
          <input type="number" id="new-sell" placeholder="1300">
        </div>
      </div>
      <div class="form-group">
        <label>Количество закуплено (шт)</label>
        <input type="number" id="new-qty" placeholder="7">
      </div>
      <div class="form-group">
        <label>Заметка по ликвидности</label>
        <input type="text" id="new-note" placeholder="Напр. самый ликвид">
      </div>
      <button class="btn btn-add" onclick="saveProduct()">Сохранить на склад</button>
      <button class="btn-outline" style="margin-top: 8px; width: 100%;" onclick="closeAddModal()">Отмена</button>
    </div>
  </div>

  <div id="toast" class="toast">Готово</div>

  <!-- Скрытый переключатель: на iOS 17.4+ его переключение даёт тактильный отклик -->
  <label class="haptic-switch" aria-hidden="true"><input type="checkbox" switch id="haptic-checkbox" tabindex="-1"></label>

  <!-- FIREBASE СКРИПТ (СИНХРОНИЗАЦИЯ) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // URL самой базы (не ссылка на консоль Firebase!)
    const FIREBASE_DB_URL = "https://tabakin-591f5-default-rtdb.asia-southeast1.firebasedatabase.app";

    const keyword = window.storeKeyword;

    try {
      const app = initializeApp({ databaseURL: FIREBASE_DB_URL });
      const db = getDatabase(app);
      const storeRef = ref(db, 'stores/' + keyword);

      // Слушатель базы: при любом изменении на телефоне ПК обновляется сам
      onValue(storeRef, (snapshot) => {
        const data = snapshot.val();
        if (data) {
          window.state.items = data.items || [];
          window.state.history = data.history || [];
          window.state.discount = data.discount !== undefined ? data.discount : 100;
          window.saveLocal();
        } else {
          // Если база пустая — запишем текущие данные
          window.pushUpdate();
        }
        document.getElementById('setting-discount').value = window.state.discount;
        render();
      }, (err) => {
        console.error('Firebase read error', err);
        showToast('Нет связи с базой, данные сохраняются локально');
      });

      window.pushUpdate = function() {
        window.saveLocal();
        render();
        set(storeRef, window.state).catch((err) => {
          console.error('Firebase write error', err);
          showToast('Ошибка синхронизации, сохранено локально');
        });
      };
    } catch (err) {
      console.error('Firebase init error', err);
      showToast('Нет связи с базой, данные сохраняются локально');
    }
  </script>

  <script>
    // Работа с Keyword в URL или памяти
    (function() {
      const urlParams = new URLSearchParams(window.location.search);
      let keyword = urlParams.get('key') || localStorage.getItem('vibe_pos_key');
      if (!keyword) {
        keyword = prompt('Придумай свое секретное слово (Keyword) для кассы:', 'sklad777');
        if (!keyword) keyword = 'default_store';
      }
      localStorage.setItem('vibe_pos_key', keyword);
      window.storeKeyword = keyword;
    })();

    // Глобальное состояние (локальная копия, пока не пришли данные из Firebase)
    window.state = {
      items: [
        { id: 1, name: "PLONQ 1500", buy: 940, sell: 1285, qty: 7, note: "самый ликвид" },
        { id: 2, name: "Plonq Max 6000", buy: 1800, sell: 2200, qty: 1, note: "дорогой, не ликвид" }
      ],
      history: [],
      discount: 100 // Фиксированная скидка по умолчанию
    };
    try {
      const cached = JSON.parse(localStorage.getItem('vibe_pos_state_' + window.storeKeyword));
      if (cached) Object.assign(window.state, cached);
    } catch (e) {}

    window.saveLocal = function() {
      localStorage.setItem('vibe_pos_state_' + window.storeKeyword, JSON.stringify(window.state));
    };

    // Запасной вариант, если Firebase не загрузился — перезаписывается в модуле Firebase
    window.pushUpdate = function() {
      window.saveLocal();
      render();
    };

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('key-label').innerText = '🔑 База: ' + window.storeKeyword;
      document.getElementById('setting-discount').value = window.state.discount;
      render();
    });

    // Вибрация при нажатии кнопок
    // iOS Safari (17.4+): программный клик по label скрытого <input type="checkbox" switch> даёт haptic.
    // Android: обычный navigator.vibrate.
    const hapticLabel = document.querySelector('.haptic-switch');
    function haptic() {
      try {
        if (navigator.vibrate) { navigator.vibrate(10); return; }
        if (hapticLabel) hapticLabel.click();
      } catch (e) {}
    }
    // Один обработчик на весь документ (capture), чтобы работало и для кнопок, которые перерисовываются в render()
    document.addEventListener('click', (e) => {
      if (e.target.closest && e.target.closest('button')) haptic();
    }, true);

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.innerText = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2000);
    }

    // Обычная продажа 1 шт.
    function sellItem(id) {
      const item = window.state.items.find(x => x.id === id);
      if (!item || item.qty <= 0) return;

      item.qty -= 1;
      const profit = item.sell - item.buy;
      
      window.state.history.unshift({
        id: Date.now(),
        productId: item.id,
        name: item.name,
        revenue: item.sell,
        profit: profit,
        date: new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }) + ', ' + new Date().toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' })
      });

      window.pushUpdate();
      showToast(`Продано! Профит: +${profit} ₽`);
    }

    // Продажа со скидкой
    function sellWithDiscount(id) {
      const item = window.state.items.find(x => x.id === id);
      if (!item || item.qty <= 0) return;

      const discount = window.state.discount || 0;
      const actualSell = Math.max(0, item.sell - discount);
      const profit = actualSell - item.buy;

      item.qty -= 1;

      window.state.history.unshift({
        id: Date.now(),
        productId: item.id,
        name: `${item.name} (скидка -${discount} ₽)`,
        revenue: actualSell,
        profit: profit,
        date: new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }) + ', ' + new Date().toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' })
      });

      window.pushUpdate();
      showToast(`Со скидкой! Профит: +${profit} ₽`);
    }

    // Удаление из истории с ВОЗВРАТОМ на склад
    function deleteHistoryItem(histId) {
      const h = window.state.history.find(x => x.id === histId);
      if (!h) return;

      if (!confirm(`Отменить эту продажу "${h.name}"?\nТовар вернется на склад (+1 шт.), а сумма спишется из выручки.`)) return;

      // Возвращаем 1 шт. товару
      const item = window.state.items.find(x => x.id === h.productId || x.name === h.name);
      if (item) {
        item.qty += 1;
      }

      // Удаляем из истории
      window.state.history = window.state.history.filter(x => x.id !== histId);
      window.pushUpdate();
      showToast(`Продажа отменена, +1 шт. на склад!`);
    }

    function render() {
      const history = window.state.history || [];
      const items = window.state.items || [];
      const discount = window.state.discount ?? 100;

      // Дашборд
      const totalProfit = history.reduce((sum, h) => sum + h.profit, 0);
      const totalRev = history.reduce((sum, h) => sum + h.revenue, 0);
      const stockCost = items.reduce((sum, i) => sum + (i.qty * i.buy), 0);

      document.getElementById('stat-total-profit').innerText = totalProfit.toLocaleString('ru-RU') + ' ₽';
      document.getElementById('stat-revenue').innerText = totalRev.toLocaleString('ru-RU') + ' ₽';
      document.getElementById('stat-stock-cost').innerText = stockCost.toLocaleString('ru-RU') + ' ₽';

      // Список товаров
      const container = document.getElementById('products-container');
      container.innerHTML = '';

      items.forEach(p => {
        const profitPerUnit = p.sell - p.buy;
        const discountedPrice = Math.max(0, p.sell - discount);
        const isOut = p.qty <= 0;
        
        container.innerHTML += `
          <div class="product-card" style="${isOut ? 'opacity: 0.55;' : ''}">
            <div class="card-head">
              <div>
                <div class="prod-name">${p.name}</div>
                ${p.note ? `<div class="note-tag" style="margin-top:6px;">💬 ${p.note}</div>` : ''}
              </div>
              <span class="badge ${isOut ? 'out' : 'in-stock'}">${isOut ? 'Закончился' : `${p.qty} шт.`}</span>
            </div>

            <div class="fin-row">
              <div class="fin-item">Закуп:<b>${p.buy} ₽</b></div>
              <div class="fin-item">Прайс:<b>${p.sell} ₽</b></div>
              <div class="fin-item">Профит:<b style="color:var(--accent-green)">+${profitPerUnit} ₽</b></div>
            </div>

            <div class="actions-grid">
              <button class="btn btn-sell" ${isOut ? 'disabled style="background:rgba(255,255,255,0.06);"' : ''} onclick="sellItem(${p.id})">
                ⚡️ 1 шт (${p.sell} ₽)
              </button>
              <button class="btn btn-discount" ${isOut ? 'disabled style="display:none;"' : ''} onclick="sellWithDiscount(${p.id})">
                🏷 Скидка (${discountedPrice} ₽)
              </button>
            </div>
            
            <div style="display:flex; justify-content: space-between; margin-top: 4px;">
              <button class="btn-outline" onclick="restock(${p.id})">+ Добавить остаток</button>
              <button class="btn-outline" style="color: var(--accent-red); border-color: transparent;" onclick="deleteProduct(${p.id})">Удалить</button>
            </div>
          </div>
        `;
      });

      // История
      const histContainer = document.getElementById('history-container');
      if (!history.length) {
        histContainer.innerHTML = '<div style="text-align:center; color:var(--text-sec); padding:30px;">Продаж пока нет</div>';
      } else {
        histContainer.innerHTML = history.map(h => `
          <div class="history-item">
            <div>
              <div style="font-size:15px; font-weight:600;">${h.name}</div>
              <div style="font-size:12px; color:var(--text-sec);">${h.date} • Выручка: ${h.revenue} ₽</div>
            </div>
            <div style="display:flex; align-items:center;">
              <div style="font-size:15px; font-weight:700; color:${h.profit >= 0 ? 'var(--accent-green)' : 'var(--accent-red)'}">
                ${h.profit >= 0 ? '+' : ''}${h.profit} ₽
              </div>
              <button class="btn-del-hist" title="Отменить продажу" onclick="deleteHistoryItem(${h.id})">✕</button>
            </div>
          </div>
        `).join('');
      }
    }

    function restock(id) {
      const add = prompt('Сколько штук пришло на склад?', '5');
      if (!add || isNaN(add)) return;
      const item = window.state.items.find(x => x.id === id);
      item.qty += parseInt(add);
      window.pushUpdate();
      showToast(`Склад пополнен (+${add} шт.)`);
    }

    function saveSettings() {
      const disc = Number(document.getElementById('setting-discount').value);
      if (isNaN(disc)) return alert('Введите число');
      window.state.discount = disc;
      window.pushUpdate();
      showToast(`Скидка сохранена (${disc} ₽)`);
    }

    function saveProduct() {
      const name = document.getElementById('new-name').value.trim();
      const buy = Number(document.getElementById('new-buy').value);
      const sell = Number(document.getElementById('new-sell').value);
      const qty = Number(document.getElementById('new-qty').value);
      const note = document.getElementById('new-note').value.trim();

      if (!name || isNaN(buy) || isNaN(sell)) return alert('Заполните название и цены');

      window.state.items.push({ id: Date.now(), name, buy, sell, qty: qty || 0, note });
      window.pushUpdate();
      closeAddModal();
      showToast('Товар добавлен!');
      document.getElementById('new-name').value = '';
      document.getElementById('new-buy').value = '';
      document.getElementById('new-sell').value = '';
      document.getElementById('new-qty').value = '';
      document.getElementById('new-note').value = '';
    }

    function deleteProduct(id) {
      if (confirm('Точно удалить этот товар?')) {
        window.state.items = window.state.items.filter(x => x.id !== id);
        window.pushUpdate();
      }
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById('tab-stock').style.display = tab === 'stock' ? 'block' : 'none';
      document.getElementById('tab-history').style.display = tab === 'history' ? 'block' : 'none';
      document.getElementById('tab-settings').style.display = tab === 'settings' ? 'block' : 'none';
    }

    function openAddModal() { document.getElementById('modal-add').style.display = 'flex'; }
    function closeAddModal() { document.getElementById('modal-add').style.display = 'none'; }

    function copyLink() {
      const key = localStorage.getItem('vibe_pos_key') || 'sklad777';
      const link = window.location.origin + window.location.pathname + '?key=' + key;
      navigator.clipboard.writeText(link);
      showToast('Ссылка с ключом скопирована!');
    }

    function changeKeyword() {
      const newKey = prompt('Введите новый Keyword:', localStorage.getItem('vibe_pos_key') || '');
      if (newKey) {
        localStorage.setItem('vibe_pos_key', newKey);
        window.location.search = '?key=' + newKey;
      }
    }
  </script>
</body>
</html>
